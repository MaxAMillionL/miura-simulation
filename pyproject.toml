[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miura-robot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3,<4", "numpy>=1.26", "trimesh>=4", "scipy>=1.11", "manifold3d>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["miura_robot"]
